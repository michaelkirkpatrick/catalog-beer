<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS (self-hosted, must load BEFORE catalog.css — the bridge overrides it) -->
    ##BOOTSTRAPCSS##

    <!-- Catalog.beer design system: tokens + bridge, then shared primitives -->
    <link rel="preload" href="/assets/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    ##DESIGNSYSTEMCSS##

    <!-- Algolia SiteSearch CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@algolia/sitesearch@latest/dist/search.min.css">

    <!--- Language --->
    <link rel="alternate" href="https://catalog.beer" hreflang="en" />
    
    ##FATHOM##

    <!-- Application Name -->
    <meta name="application-name" content="Catalog.beer">
    <meta name="apple-mobile-web-app-title" content="Catalog.beer">

    <!-- Page Title -->
    <title>##PAGETITLE##</title>
</head>
